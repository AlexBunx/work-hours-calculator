<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Часы</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#8e8e93;--ac:#d8b13c;--acx:#000;--ln:#2c2c2e;--rd:#ff453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f7;--card:#fff;--tx:#000;--mut:#6c6c70;--ac:#b8901c;--acx:#fff;--ln:#e5e5ea;color-scheme:light}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#8e8e93;--ac:#d8b13c;--acx:#000;--ln:#2c2c2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:12px 16px 40px;max-width:520px;margin-inline:auto}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.lang button{padding:6px 10px;min-height:32px;font-size:13px;border-radius:10px}
.lang button.on{background:var(--ac);color:var(--acx);font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.nav h1{font-size:22px;margin:0}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;min-height:44px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.sum b{display:block;font-size:24px}
.sum span{color:var(--mut);font-size:13px}
.big{grid-column:1/-1;border-top:1px solid var(--ln);padding-top:10px;margin-top:4px}
.big b{font-size:32px;color:var(--ac)}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
input,textarea{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.row>div{min-width:0}input[type=number],input[type=time]{height:46px;min-width:0;-webkit-appearance:none;appearance:none;text-align:left}.off{color:var(--mut)}input[type=text]{height:46px}select{width:100%;height:46px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:0 10px}
.rate{display:flex;align-items:center;gap:10px}
.rate label{flex:1}
.rate input{width:90px}
.item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.item small{color:var(--mut);margin-left:8px;white-space:nowrap}
.item br{display:none}
#lw summary,#calcard summary,#rp summary{padding:2px 0;font-size:15px}
#cal{margin-top:10px}
#list{margin-top:6px}
.x{color:var(--rd);background:none;padding:6px 10px}
.empty{color:var(--mut);text-align:center;padding:10px}
textarea{min-height:110px}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--ac)}
.tg{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer}
.tg input{width:22px;height:22px;padding:0;flex:none}
.tg span{font-size:15px}
.ph{color:var(--mut);font-size:13px;margin-top:6px}
:root{--wk:rgba(216,177,60,.26);--sk:rgba(255,69,58,.24);--vc:rgba(10,132,255,.28)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--wk:rgba(184,144,28,.22);--sk:rgba(255,69,58,.16);--vc:rgba(10,132,255,.16)}}
.nav button{width:44px;padding:0;font-size:24px}
#set summary{padding:2px 0;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wh{text-align:center;color:var(--mut);font-size:12px;padding-bottom:2px}
.cal .wh.we{opacity:.65}
.cd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-height:46px;aspect-ratio:1/1.05;border-radius:12px;background:transparent;border:1px solid var(--ln);font-size:16px;line-height:1.1;transition:transform .08s}
.cd:active{transform:scale(.9)}
.cd small{font-size:10px;color:var(--mut);max-width:100%;white-space:nowrap;overflow:hidden}
.cd.w{background:var(--wk);border-color:transparent}.cd.w small{color:var(--tx);opacity:.75}
.cd.k{background:var(--sk);border-color:transparent}.cd.v{background:var(--vc);border-color:transparent}
.cd.o,.cd.we{color:var(--mut)}
.cd.td::after{content:"";position:absolute;top:4px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
.cd.sel{outline:2px solid var(--ac);outline-offset:1px}
.edh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.edh b{font-size:19px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;padding:8px;line-height:1.25;background:var(--bg);border:1px solid var(--ln);font-weight:600}
.chips small{font-weight:400;color:var(--mut)}
.chips button:active,.acts button:active{opacity:.7}
.card button:not(.p):not(.x):not(.cd){background:var(--bg);border:1px solid var(--ln)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.st button{padding:8px 4px}
.item>div:first-child{flex:1;cursor:pointer;padding:4px 0}
</style>
</head>
<body>
<div class="lang" id="lang"><button data-l="ru">RU</button><button data-l="pl">PL</button><button data-l="en">EN</button></div>
<div class="nav"><button id="prev">‹</button><h1 id="mt"></h1><button id="next">›</button></div>

<div class="card sum">
  <div><b id="sd">0</b><span data-i="sd"></span></div>
  <div><b id="sh">0</b><span data-i="sh"></span></div>
  <div><b id="sa">0</b><span data-i="sa"></span></div>
  <div class="big"><b id="sm">0 zł</b><span data-i="sm"></span></div>
  <div id="sk" style="grid-column:1/-1;color:var(--mut);font-size:13px;white-space:pre-line"></div>
</div>

<div class="card" id="ed">
  <div class="edh"><b id="sel"></b><button class="x" id="clr">✕</button></div>
  <label data-i="shift"></label>
  <div class="chips"><button id="q8"></button><button id="q10"></button></div>
  <div class="row">
    <div><label data-i="lbl_day"></label><input id="d" type="number" inputmode="numeric" min="1" max="31"></div>
    <div><label data-i="lbl_hours"></label><input id="h" type="number" inputmode="decimal" step="0.25"></div>
    <div><label data-i="lbl_from"></label><input id="s" type="time" value="07:00"></div>
    <div><label data-i="lbl_to"></label><input id="e" type="time" value="15:00"></div>
  </div>
  <button class="p" id="add" style="width:100%" data-i="add"></button>
  <div class="st"><button id="off" data-i="off"></button><button id="sick" data-i="sick"></button><button id="vac" data-i="vac"></button></div>
</div>

<details class="card" id="calcard"><summary data-i="cal_t"></summary><div class="cal" id="cal"></div></details>

<details class="card" id="set">
  <summary><span data-i="settings"></span> · <span id="setv"></span></summary>
  <div class="rate" style="margin-top:12px"><label style="margin:0" data-i="rate"></label><input id="rate" type="number" inputmode="decimal" step="0.5"></div>
  <label class="tg"><input id="prem" type="checkbox"><span data-i="prem"></span></label>
  <div class="ph" id="premhint"></div>
  <div class="rate" style="margin-top:12px"><label style="margin:0" data-i="sp"></label><input id="sp" type="number" inputmode="decimal" step="1"></div>
</details>

<details class="card" id="lw"><summary id="lsum"></summary><div id="list"></div></details>

<div class="card">
  <details>
    <summary data-i="imp_sum"></summary>
    <p style="color:var(--mut);font-size:14px" data-i="imp_hint"></p>
    <textarea id="imp" placeholder="2 - 8 (7:00 - 15:00)&#10;3 - 8 (7:00 - 15:00)"></textarea>
    <div class="acts"><button class="p" id="doimp" data-i="do_imp"></button><button id="exp" data-i="exp"></button><button id="bk" data-i="bk"></button><button id="rs" data-i="rs"></button></div>
  </details>
</div>

<details class="card" id="rp">
  <summary data-i="rep_title"></summary>
  <div class="row" style="margin-top:10px">
    <div><label data-i="rep_name"></label><input id="rn" type="text" data-ph="rep_name_ph"></div>
    <div><label data-i="rep_lang"></label><select id="rl"><option value="ru">Русский</option><option value="pl">Polski</option><option value="en">English</option></select></div>
  </div>
  <button class="p" id="pdf" style="width:100%" data-i="rep_btn"></button>
  <div id="pdfmsg" style="color:var(--mut);font-size:14px;margin-top:8px"></div>
</details>

<div class="card" style="text-align:center;font-size:15px"><a href="https://docs.google.com/forms/d/e/1FAIpQLSe16nd2fWqV62IXGQYWcY2Y6QzOkCPnpTUR6yst1VxJNny38A/viewform" target="_blank" rel="noopener" style="color:var(--ac)">Оставить отзыв · Send feedback · Prześlij opinię</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

},

 sick_line:"Dni chorobowego: {n} ({h} godz.), wypłata {p} zł",u:"godz.",li_off:"dzień wolny",li_sick:"chorobowe",exp_head:"Godzina = {r} zł netto",
 p_title:"Wykaz przepracowanych godzin",p_per:"Okres",p_nm:"Pracownik",p_date:"Data",p_day:"Dzień",p_from:"Od",p_to:"Do",p_hours:"Godziny",
 p_off:"dzień wolny",p_sick:"zwolnienie lekarskie",p_skd:"Dni zwolnienia",p_wd:"Przepracowane dni",p_th:"Razem godzin"
},
en:{

 wdn:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
 title:"Hours",settings:"Settings",shift:"Shift",cs_off:"off",cs_sick:"sick",cs_vac:"vac",sd:"days",sh:"hours",sa:"avg/day",sm:"net for the month",
 rate:"Rate, zł/hour (net)",prem:"Umowa o pracę: premiums and paid vacation",sp:"Sick pay, % of rate",
 premOn:"Hours 9–10: +50%, from hour 11: +100%, work on Sat/Sun: +100% for the whole day. Vacation is paid at the average rate. Premiums this month: +{x} zł",

}};
const K="hours-demo-v1";
let db={rate:31,months:{}};
try{const r=localStorage.getItem(K);if(r)db=JSON.parse(r)}catch(e){}
const detect=()=>{const n=((navigator.languages&&navigator.languages[0])||navigator.language||"en").toLowerCase();return n.startsWith("pl")?"pl":(n.startsWith("ru")||n.startsWith("be")||n.startsWith("uk"))?"ru":"en"};
let ui=I18N[db.ui]?db.ui:detect();
const t=(k,p,l)=>{const L=I18N[l||ui];let s=L[k];if(s==null)s=I18N.en[k];if(s==null)return k;if(p)for(const q in p)s=s.split("{"+q+"}").join(p[q]);return s};
const now=new Date();let y=now.getFullYear(),m=now.getMonth();
const $=i=>document.getElementById(i);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const key=()=>y+"-"+(m+1);
const cur=()=>db.months[key()]||(db.months[key()]={});
const pad=n=>String(n).padStart(2,"0");
const dl=d=>d+" "+I18N[ui].mo[m].slice(0,3).toLowerCase()+", "+I18N[ui].wdn[new Date(y,m,d).getDay()];
const t2m=x=>{const[a,b]=x.split(":").map(Number);return a*60+b};
const fmt=(n,l)=>{const s=(Math.round(n*100)/100).toString();return (l||ui)==="en"?s:s.replace(".",",")};
function avgRate(){
  const c=cur();let p=0,h=0;
  for(const k in c){const e=c[k];if(e.off||e.sick||e.vac||!(e.h>0))continue;p+=pay(+k,e);h+=e.h}
  return h>0?p/h:db.rate;
}
function pay(d,e){
  const h=e.h;if(e.off||!(h>0))return 0;
  const r=db.rate;if(e.sick)return h*avgRate()*(db.sp==null?80:db.sp)/100;if(e.vac)return db.prem?h*avgRate():0;if(!db.prem)return h*r;
  const w=new Date(y,m,d).getDay();
  if(w===0||w===6)return h*r*2;
  return Math.min(h,8)*r+Math.min(Math.max(h-8,0),2)*r*1.5+Math.max(h-10,0)*r*2;
}
function calc(){const s=$("s").value,e=$("e").value;if(s&&e){let d=t2m(e)-t2m(s);if(d<0)d+=1440;$("h").value=d/60}}
function render(){
  $("mt").textContent=I18N[ui].mo[m]+" "+y;
  $("rate").value=db.rate;
  $("prem").checked=!!db.prem;
  if(document.activeElement!==$("sp"))$("sp").value=db.sp==null?80:db.sp;  const c=cur(),days=Object.keys(c).map(Number).sort((a,b)=>a-b),u=t("u");
  let th=0,sh=0,sn=0,spay=0,vh=0,vn=0,vpay=0;
  days.forEach(d=>{const e=c[d];if(e.sick){sn++;sh+=e.h;spay+=pay(d,e)}else if(e.vac){vn++;vh+=e.h;vpay+=pay(d,e)}else th+=e.h});
  const wd=days.filter(d=>!c[d].off&&!c[d].sick&&!c[d].vac).length;
  $("sd").textContent=wd;$("sh").textContent=fmt(th);
  $("sa").textContent=wd?fmt(th/wd):0;
  let tp=0;days.forEach(d=>tp+=pay(d,c[d]));
  $("sm").textContent=fmt(tp)+" zł";
  $("sk").textContent=[sn?t("sick_line",{n:sn,h:fmt(sh),p:fmt(spay)}):"",vn?t("vac_line",{n:vn,h:fmt(vh),p:fmt(vpay)}):""].filter(Boolean).join("\n");
  $("premhint").textContent=db.prem?t("premOn",{x:fmt(tp-spay-vpay-th*db.rate)}):t("premOff");
  drawCal(c);
  const L=$("list");$("lsum").textContent=t("list_t")+" ("+days.length+")";
  if(!days.length){L.innerHTML='<div class="empty">'+t("empty")+'</div>';return}
  L.innerHTML="";
  days.forEach(d=>{
    const x=c[d],el=document.createElement("div");el.className="item";
    const info=document.createElement("div");
    info.innerHTML=x.off?"<b>"+dl(d)+"</b> — <span class=\"off\">"+t("li_off")+"</span>":x.sick?"<b>"+dl(d)+"</b> — <span class=\"off\">"+t("li_sick")+"</span><br><small>"+fmt(x.h)+" "+u+" · "+fmt(pay(d,x))+" zł</small>":x.vac?"<b>"+dl(d)+"</b> — <span class=\"off\">"+t("li_vac")+"</span><br><small>"+fmt(x.h)+" "+u+" · "+fmt(pay(d,x))+" zł</small>":"<b>"+dl(d)+"</b> — "+fmt(x.h)+" "+u+"<br><small>"+fmt(pay(d,x))+" zł</small>";
    info.onclick=()=>{selectDay(d,true);$("ed").scrollIntoView({behavior:"smooth",block:"center"})};
    const b=document.createElement("button");b.className="x";b.textContent="✕";
    b.onclick=()=>{delete c[d];save();render()};
    el.append(info,b);L.append(el);
  });
}
function applyLang(){
  document.documentElement.lang=ui;
  document.title=t("title")+TITLE_SUFFIX;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i)});
  document.querySelectorAll("[data-ph]").forEach(el=>{el.placeholder=t(el.dataset.ph)});
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===ui));
  if(!db.lang)$("rl").value=ui;
  render();
}
const flash=(id,k)=>{$(id).textContent=t(k);setTimeout(()=>{$(id).textContent=t($(id).dataset.i)},1800)};
document.querySelectorAll("#lang button").forEach(b=>{b.onclick=()=>{ui=b.dataset.l;db.ui=ui;save();applyLang()}});
$("s").oninput=calc;$("e").oninput=calc;
const dim=()=>new Date(y,m+1,0).getDate();
const nextDay=d=>Math.min(d+1,dim());
function selectDay(d,load){$("d").value=d;const x=cur()[d];if(load&&x&&!x.off){$("s").value=x.s||"";$("e").value=x.e||"";$("h").value=x.h}render()}
function commit(o){const d=parseInt($("d").value);if(!(d>=1&&d<=dim()))return;cur()[d]=o;save();selectDay(nextDay(d))}
function quick(s,e,h){$("s").value=s;$("e").value=e;$("h").value=h;commit({h:h,s:s,e:e})}
$("q8").onclick=()=>quick("07:00","15:00",8);$("q10").onclick=()=>quick("07:00","17:00",10);
$("clr").onclick=()=>{const d=parseInt($("d").value);if(cur()[d]){delete cur()[d];save();render()}};
$("d").oninput=()=>render();
function drawCal(c){
  const u=t("u"),el=$("cal"),sel=parseInt($("d").value),first=(new Date(y,m,1).getDay()+6)%7,n=dim();
  const td=(now.getFullYear()===y&&now.getMonth()===m)?now.getDate():0;
  el.innerHTML="";
  [1,2,3,4,5,6,0].forEach(w=>{const h=document.createElement("div");h.className="wh"+(w===0||w===6?" we":"");h.textContent=I18N[ui].wdn[w];el.append(h)});
  for(let i=0;i<first;i++)el.append(document.createElement("div"));
  for(let d=1;d<=n;d++){
    const x=c[d],w=new Date(y,m,d).getDay(),b=document.createElement("button");
    let cls="cd",sm="";
    if(x){if(x.off){cls+=" o";sm=t("cs_off")}else if(x.sick){cls+=" k";sm=t("cs_sick")}else if(x.vac){cls+=" v";sm=t("cs_vac")}else{cls+=" w";sm=fmt(x.h)}}
    else if(w===0||w===6)cls+=" we";
    if(d===td)cls+=" td";if(d===sel)cls+=" sel";
    b.className=cls;b.innerHTML=d+(sm?"<small>"+sm+"</small>":"");
    b.onclick=()=>selectDay(d,true);el.append(b);
  }
  $("sel").textContent=sel>=1&&sel<=n?dl(sel):"";
  $("clr").style.visibility=c[sel]?"visible":"hidden";
  $("q8").innerHTML="7:00–15:00<br><small>8 "+u+"</small>";$("q10").innerHTML="7:00–17:00<br><small>10 "+u+"</small>";
  $("setv").textContent=fmt(db.rate)+" zł/"+u+" · "+(db.prem?"umowa o pracę":"umowa zlecenie");
}
let tx=null;const cc=$("calcard");
cc.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
cc.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>70)(dx<0?$("next"):$("prev")).click()},{passive:true});
$("add").onclick=()=>{const h=parseFloat($("h").value);if(!(h>0))return;commit({h:h,s:$("s").value,e:$("e").value})};
$("off").onclick=()=>commit({h:0,s:"",e:"",off:1});
$("prem").onchange=()=>{db.prem=$("prem").checked;save();render()};
$("sick").onclick=()=>commit({h:parseFloat($("h").value)||8,s:"",e:"",sick:1});
$("sp").oninput=()=>{const v=parseFloat($("sp").value);if(v>=0){db.sp=v;save();render()}};
$("vac").onclick=()=>commit({h:parseFloat($("h").value)||8,s:"",e:"",vac:1});$("rate").oninput=()=>{const v=parseFloat($("rate").value);if(v>=0){db.rate=v;save();render();}};
$("prev").onclick=()=>{m--;if(m<0){m=11;y--}$("d").value=Math.min(parseInt($("d").value)||1,dim());render()};
$("next").onclick=()=>{m++;if(m>11){m=0;y++}$("d").value=Math.min(parseInt($("d").value)||1,dim());render()};
$("doimp").onclick=()=>{
  const re=/^\s*(\d{1,2})\s*-\s*(\d+(?:[.,]\d+)?)\s*(?:\(\s*(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})\s*\))?/;
  let n=0;
  const rk=/^\s*(\d{1,2})\s*-\s*(?:больничный|бол|chorobowe|zwolnienie|L4|sick leave|sick)\s*(\d+(?:[.,]\d+)?)?/i;
  const ro=/^\s*(\d{1,2})\s*-\s*(?:выходной|вых|dzień wolny|wolne|wolny|day off|off)/i;
  const rv=/^\s*(\d{1,2})\s*-\s*(?:отпуск|отп|urlop|vacation)\s*(\d+(?:[.,]\d+)?)?/i;
  $("imp").value.split("\n").forEach(l=>{const o=ro.exec(l);if(o){cur()[+o[1]]={h:0,s:"",e:"",off:1};n++;return;}
    const k=rk.exec(l);if(k){cur()[+k[1]]={h:k[2]?parseFloat(k[2].replace(",",".")):8,s:"",e:"",sick:1};n++;return;}
    const v=rv.exec(l);if(v){cur()[+v[1]]={h:v[2]?parseFloat(v[2].replace(",",".")):8,s:"",e:"",vac:1};n++;return;}
    const r=re.exec(l);if(!r)return;
    const d=+r[1],h=parseFloat(r[2].replace(",","."));
    if(d<1||d>31||!(h>0))return;
    const pt=x=>x?pad(x.split(":")[0])+":"+x.split(":")[1]:"";
    cur()[d]={h:h,s:pt(r[3]),e:pt(r[4])};n++;
  });
  save();render();$("imp").value="";
  $("doimp").textContent=t("added",{n:n});setTimeout(()=>{$("doimp").textContent=t("do_imp")},1800);
};
$("exp").onclick=async()=>{
  const c=cur();
  let s=I18N[ui].mo[m]+"\n"+t("exp_head",{r:db.rate})+"\n\n";
  Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(d=>{const x=c[d];if(x.off){s+=d+" - "+t("li_off")+"\n";return}if(x.sick){s+=d+" - "+t("li_sick")+" "+fmt(x.h)+"\n";return}if(x.vac){s+=d+" - "+t("li_vac")+" "+fmt(x.h)+"\n";return}s+=d+" - "+fmt(x.h)+(x.s?" ("+x.s.replace(/^0/,"")+" - "+x.e.replace(/^0/,"")+")":"")+"\n"});
  try{await navigator.clipboard.writeText(s);$("exp").textContent=t("copied")}catch(e){$("imp").value=s;$("exp").textContent=t("text_above")}
  setTimeout(()=>{$("exp").textContent=t("exp")},1800);
};

$("rn").value=db.name||"";$("rl").value=db.lang||ui;
$("rn").oninput=()=>{db.name=$("rn").value;save()};
$("rl").onchange=()=>{db.lang=$("rl").value;save()};
$("bk").onclick=async()=>{const s=JSON.stringify(db);try{await navigator.clipboard.writeText(s);$("bk").textContent=t("copied")}catch(e){$("imp").value=s;$("bk").textContent=t("text_above")}setTimeout(()=>{$("bk").textContent=t("bk")},1800)};
$("rs").onclick=()=>{try{const o=JSON.parse($("imp").value);if(!o||!o.months)throw 0;db=o;save();$("imp").value="";applyLang();$("rs").textContent=t("done")}catch(e){$("rs").textContent=t("paste_backup")}setTimeout(()=>{$("rs").textContent=t("rs")},1800)};
$("pdf").onclick=async()=>{
  const rl=$("rl").value,L=I18N[rl],c=cur(),days=Object.keys(c).map(Number).filter(d=>!c[d].off).sort((a,b)=>a-b),msg=$("pdfmsg");
  if(!days.length){msg.textContent=t("pdf_empty");return}
  if(!window.jspdf){msg.textContent=t("pdf_nolib");return}
  msg.textContent=t("pdf_busy");
  const S=3,cv=document.createElement("canvas");cv.width=595*S;cv.height=842*S;
  const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);
  const F=(sz,b)=>{x.font=(b?"600 ":"400 ")+sz*S+"px -apple-system,Helvetica,Arial,sans-serif"};
  const T=(s,px,py,al)=>{x.textAlign=al||"left";x.fillText(s,px*S,py*S)};
  const LN=(py,col)=>{x.fillStyle=col;x.fillRect(40*S,py*S,515*S,S)};
  x.fillStyle="#000";F(20,1);T(t("p_title",null,rl),40,60);
  F(12);x.fillStyle="#444";T(t("p_per",null,rl)+": "+L.mo[m]+" "+y,40,86);
  const nm=$("rn").value.trim();if(nm)T(t("p_nm",null,rl)+": "+nm,40,104);
  const y0=140;
  F(11,1);x.fillStyle="#000";
  T(t("p_date",null,rl),40,y0);T(t("p_day",null,rl),140,y0);T(t("p_from",null,rl),230,y0);T(t("p_to",null,rl),300,y0);T(t("p_hours",null,rl),555,y0,"right");
  LN(y0+6,"#999");
  F(11);let th=0,wk=0,sk=0,skh=0,vc=0,vch=0;
  days.forEach((d,i)=>{
    const e=c[d],py=y0+26+i*20;
    if(e.vac||e.sick){x.fillStyle=e.sick?"#fde2e2":"#dbeafe";x.fillRect(40*S,(py-14)*S,515*S,19*S)}
    x.fillStyle="#000";
    T(pad(d)+"."+pad(m+1)+"."+y,40,py);
    T(L.wdn[new Date(y,m,d).getDay()],140,py);
    if(e.vac){F(11,1);x.fillStyle="#1e40af";T(t("p_vac",null,rl),230,py);F(11);x.fillStyle="#000";T(fmt(e.h,rl),555,py,"right");vc++;vch+=e.h}
    else if(e.sick){F(11,1);x.fillStyle="#b91c1c";T(t("p_sick",null,rl),230,py);F(11);x.fillStyle="#000";T(fmt(e.h,rl),555,py,"right");sk++;skh+=e.h}
    else{T(e.s||"",230,py);T(e.e||"",300,py);T(fmt(e.h,rl),555,py,"right");th+=e.h;wk++}
    LN(py+6,"#e5e5e5");
  });
  const fy=y0+26+days.length*20+16;
  F(12,1);x.fillStyle="#000";T(t("p_wd",null,rl)+": "+wk,40,fy);T(t("p_th",null,rl)+": "+fmt(th,rl),40,fy+20);let ly=fy+40;
  if(sk){T(t("p_skd",null,rl)+": "+sk+" ("+fmt(skh,rl)+" "+t("u",null,rl)+")",40,ly);ly+=20}
  if(vc)T(t("p_vacd",null,rl)+": "+vc+" ("+fmt(vch,rl)+" "+t("u",null,rl)+")",40,ly);
  const img=cv.toDataURL("image/jpeg",0.92);
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  pdf.addImage(img,"JPEG",0,0,595.28,841.89);
  const blob=pdf.output("blob"),fn="hours-"+y+"-"+pad(m+1)+".pdf";
  try{const dls=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dls){await dls.save({filename:fn,data:blob});msg.textContent="";return}}
  catch(e){if(e&&e.code==="declined"){msg.textContent="";return}}
  const file=new File([blob],fn,{type:"application/pdf"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});msg.textContent="";return}}
  catch(e){if(e&&e.name==="AbortError"){msg.textContent="";return}}
  const u=URL.createObjectURL(blob),an=document.createElement("a");an.href=u;an.download=fn;document.body.append(an);an.click();an.remove();
  msg.textContent="";const l=document.createElement("a");l.href=u;l.target="_blank";l.textContent=t("open_pdf");l.style.color="var(--ac)";msg.append(l);
};
$("d").value=now.getDate();calc();applyLang();
</script>
