<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Часы — демо</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#8e8e93;--ac:#d8b13c;--acx:#000;--ln:#2c2c2e;--rd:#ff453a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f7;--card:#fff;--tx:#000;--mut:#6c6c70;--ac:#b8901c;--acx:#fff;--ln:#e5e5ea;color-scheme:light}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#8e8e93;--ac:#d8b13c;--acx:#000;--ln:#2c2c2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:12px 16px 40px;max-width:520px;margin-inline:auto}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.nav h1{font-size:22px;margin:0}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.sum b{display:block;font-size:24px}
.sum span{color:var(--mut);font-size:13px}
.big{grid-column:1/-1;border-top:1px solid var(--ln);padding-top:10px;margin-top:4px}
.big b{font-size:32px;color:var(--ac)}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
input,textarea{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.row>div{min-width:0}input[type=number],input[type=time]{height:46px;min-width:0;-webkit-appearance:none;appearance:none;text-align:left}.off{color:var(--mut)}input[type=text]{height:46px}select{width:100%;height:46px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:0 10px}
.rate{display:flex;align-items:center;gap:10px}
.rate input{width:90px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border:0}
.item small{color:var(--mut)}
.x{color:var(--rd);background:none;padding:6px 10px}
.empty{color:var(--mut);text-align:center;padding:10px}
textarea{min-height:110px}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--ac)}
.tg{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer}
.tg input{width:22px;height:22px;padding:0;flex:none}
.tg span{font-size:15px}
.ph{color:var(--mut);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="nav"><button id="prev">‹</button><h1 id="mt"></h1><button id="next">›</button></div>

<div class="card sum">
  <div><b id="sd">0</b><span>дней</span></div>
  <div><b id="sh">0</b><span>часов</span></div>
  <div><b id="sa">0</b><span>средн./день</span></div>
  <div class="big"><b id="sm">0 zł</b><span>netto за месяц</span></div>
  <div id="sk" style="grid-column:1/-1;color:var(--mut);font-size:13px"></div>
</div>

<div class="card">
  <div class="rate"><label style="margin:0">Ставка, zł/час (netto)</label><input id="rate" type="number" inputmode="decimal" step="0.5"></div>
  <label class="tg"><input id="prem" type="checkbox"><span>Надбавки (umowa o pracę)</span></label>
  <div class="ph" id="premhint"></div>
  <div class="rate" style="margin-top:12px"><label style="margin:0">Больничный, % от ставки</label><input id="sp" type="number" inputmode="decimal" step="1"></div>
</div>

<div class="card">
  <div class="row">
    <div><label>День</label><input id="d" type="number" inputmode="numeric" min="1" max="31"></div>
    <div><label>Часов</label><input id="h" type="number" inputmode="decimal" step="0.25"></div>
    <div><label>С</label><input id="s" type="time" value="07:00"></div>
    <div><label>До</label><input id="e" type="time" value="15:00"></div>
  </div>
  <div class="acts" style="margin-top:0"><button class="p" id="add" style="flex:1">Добавить / обновить</button><button id="off">Выходной</button><button id="sick">Больничный</button></div>
</div>

<div class="card" id="list"></div>

<div class="card">
  <details>
    <summary>Импорт из заметок / экспорт</summary>
    <p style="color:var(--mut);font-size:14px">Вставь строки вида «2 - 8 (7:00 - 15:00)» — они добавятся в выбранный месяц.</p>
    <textarea id="imp" placeholder="2 - 8 (7:00 - 15:00)&#10;3 - 8 (7:00 - 15:00)"></textarea>
    <div class="acts"><button class="p" id="doimp">Импортировать</button><button id="exp">Копировать месяц</button><button id="bk">Копия данных</button><button id="rs">Восстановить</button></div>
  </details>
</div>

<div class="card">
  <b>Отчёт для рекрутера (PDF)</b>
  <div class="row" style="margin-top:10px">
    <div><label>Имя в отчёте</label><input id="rn" type="text" placeholder="Имя Фамилия"></div>
    <div><label>Язык отчёта</label><select id="rl"><option value="ru">Русский</option><option value="pl">Polski</option></select></div>
  </div>
  <button class="p" id="pdf" style="width:100%">Сформировать PDF за месяц</button>
  <div id="pdfmsg" style="color:var(--mut);font-size:14px;margin-top:8px"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const M=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const K="hours-demo-v1";
let db={rate:31,months:{}};
try{const r=localStorage.getItem(K);if(r)db=JSON.parse(r)}catch(e){}
const now=new Date();let y=now.getFullYear(),m=now.getMonth();
const $=i=>document.getElementById(i);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const key=()=>y+"-"+(m+1);
const cur=()=>db.months[key()]||(db.months[key()]={});
const pad=n=>String(n).padStart(2,"0");
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const dl=d=>d+" "+M[m].slice(0,3).toLowerCase()+", "+WD[new Date(y,m,d).getDay()];
const t2m=t=>{const[a,b]=t.split(":").map(Number);return a*60+b};
const fmt=n=>(Math.round(n*100)/100).toString().replace(".",",");
function pay(d,e){
  const h=e.h;if(e.off||!(h>0))return 0;
  const r=db.rate;if(e.sick)return h*r*(db.sp==null?80:db.sp)/100;if(!db.prem)return h*r;
  const w=new Date(y,m,d).getDay();
  if(w===0||w===6)return h*r*2;
  return Math.min(h,8)*r+Math.min(Math.max(h-8,0),2)*r*1.5+Math.max(h-10,0)*r*2;
}
function calc(){const s=$("s").value,e=$("e").value;if(s&&e){let d=t2m(e)-t2m(s);if(d<0)d+=1440;$("h").value=d/60}}
function render(){
  $("mt").textContent=M[m]+" "+y;
  $("rate").value=db.rate;
  $("prem").checked=!!db.prem;
  if(document.activeElement!==$("sp"))$("sp").value=db.sp==null?80:db.sp;
  const c=cur(),days=Object.keys(c).map(Number).sort((a,b)=>a-b);
  let th=0,sh=0,sn=0,spay=0;
  days.forEach(d=>{const e=c[d];if(e.sick){sn++;sh+=e.h;spay+=pay(d,e)}else th+=e.h});
  const wd=days.filter(d=>!c[d].off&&!c[d].sick).length;
  $("sd").textContent=wd;$("sh").textContent=fmt(th);
  $("sa").textContent=wd?fmt(th/wd):0;
  let tp=0;days.forEach(d=>tp+=pay(d,c[d]));
  $("sm").textContent=fmt(tp)+" zł";
  $("sk").textContent=sn?"Больничных дней: "+sn+" ("+fmt(sh)+" ч), оплата "+fmt(spay)+" zł":"";
  $("premhint").textContent=db.prem
    ?"9–10 ч: +50%, с 11 ч: +100%, работа в сб/вс: +100% за весь день. Надбавки за месяц: +"+fmt(tp-spay-th*db.rate)+" zł"
    :"Выключено: все часы по одной ставке (umowa zlecenie).";
  const L=$("list");
  if(!days.length){L.innerHTML='<div class="empty">Пока нет записей</div>';return}
  L.innerHTML="";
  days.forEach(d=>{
    const x=c[d],el=document.createElement("div");el.className="item";
    const info=document.createElement("div");
    info.innerHTML=x.off?"<b>"+dl(d)+"</b> — <span class=\"off\">выходной</span>":x.sick?"<b>"+dl(d)+"</b> — <span class=\"off\">больничный</span><br><small>"+fmt(x.h)+" ч · "+fmt(pay(d,x))+" zł</small>":"<b>"+dl(d)+"</b> — "+fmt(x.h)+" ч<br><small>"+(x.s?x.s+" – "+x.e+" · ":"")+fmt(pay(d,x))+" zł</small>";
    info.onclick=()=>{$("d").value=d;$("s").value=x.s||"";$("e").value=x.e||"";$("h").value=x.h};
    const b=document.createElement("button");b.className="x";b.textContent="✕";
    b.onclick=()=>{delete c[d];save();render()};
    el.append(info,b);L.append(el);
  });
}
$("s").oninput=calc;$("e").oninput=calc;
$("add").onclick=()=>{
  const d=parseInt($("d").value),h=parseFloat($("h").value);
  if(!(d>=1&&d<=31)||!(h>0))return;
  cur()[d]={h:h,s:$("s").value,e:$("e").value};
  save();render();$("d").value=Math.min(d+1,31);
};
$("off").onclick=()=>{const d=parseInt($("d").value);if(!(d>=1&&d<=31))return;cur()[d]={h:0,s:"",e:"",off:1};save();render();$("d").value=Math.min(d+1,31)};
$("prem").onchange=()=>{db.prem=$("prem").checked;save();render()};
$("sick").onclick=()=>{const d=parseInt($("d").value),h=parseFloat($("h").value)||8;if(!(d>=1&&d<=31))return;cur()[d]={h:h,s:"",e:"",sick:1};save();render();$("d").value=Math.min(d+1,31)};
$("sp").oninput=()=>{const v=parseFloat($("sp").value);if(v>=0){db.sp=v;save();render()}};
$("rate").oninput=()=>{const v=parseFloat($("rate").value);if(v>=0){db.rate=v;save();render();}};
$("prev").onclick=()=>{m--;if(m<0){m=11;y--}render()};
$("next").onclick=()=>{m++;if(m>11){m=0;y++}render()};
$("doimp").onclick=()=>{
  const re=/^\s*(\d{1,2})\s*-\s*(\d+(?:[.,]\d+)?)\s*(?:\(\s*(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})\s*\))?/;
  let n=0;const rk=/^\s*(\d{1,2})\s*-\s*(?:больничный|бол)\s*(\d+(?:[.,]\d+)?)?/i;const ro=/^\s*(\d{1,2})\s*-\s*(?:выходной|вых)/i;
  $("imp").value.split("\n").forEach(l=>{const o=ro.exec(l);if(o){cur()[+o[1]]={h:0,s:"",e:"",off:1};n++;return;}
    const k=rk.exec(l);if(k){cur()[+k[1]]={h:k[2]?parseFloat(k[2].replace(",",".")):8,s:"",e:"",sick:1};n++;return;}
    const r=re.exec(l);if(!r)return;
    const d=+r[1],h=parseFloat(r[2].replace(",","."));
    if(d<1||d>31||!(h>0))return;
    const pt=t=>t?pad(t.split(":")[0])+":"+t.split(":")[1]:"";
    cur()[d]={h:h,s:pt(r[3]),e:pt(r[4])};n++;
  });
  save();render();$("imp").value="";
  $("doimp").textContent="Добавлено: "+n;setTimeout(()=>$("doimp").textContent="Импортировать",1800);
};
$("exp").onclick=async()=>{
  const c=cur();
  let t=M[m]+"\nЧас = "+db.rate+" zl. Netto\n\n";
  Object.keys(c).map(Number).sort((a,b)=>a-b).forEach(d=>{const x=c[d];if(x.off){t+=d+" - выходной\n";return}if(x.sick){t+=d+" - больничный "+fmt(x.h)+"\n";return}t+=d+" - "+fmt(x.h)+(x.s?" ("+x.s.replace(/^0/,"")+" - "+x.e.replace(/^0/,"")+")":"")+"\n"});
  try{await navigator.clipboard.writeText(t);$("exp").textContent="Скопировано"}catch(e){$("imp").value=t;$("exp").textContent="Текст выше"}
  setTimeout(()=>$("exp").textContent="Копировать месяц",1800);
};
$("rn").value=db.name||"";$("rl").value=db.lang||"ru";
$("rn").oninput=()=>{db.name=$("rn").value;save()};
$("rl").onchange=()=>{db.lang=$("rl").value;save()};
$("bk").onclick=async()=>{const t=JSON.stringify(db);try{await navigator.clipboard.writeText(t);$("bk").textContent="Скопировано"}catch(e){$("imp").value=t;$("bk").textContent="Текст выше"}setTimeout(()=>$("bk").textContent="Копия данных",1800)};
$("rs").onclick=()=>{try{const o=JSON.parse($("imp").value);if(!o||!o.months)throw 0;db=o;save();render();$("imp").value="";$("rs").textContent="Готово"}catch(e){$("rs").textContent="Вставь копию в поле"}setTimeout(()=>$("rs").textContent="Восстановить",1800)};
const TX={
 ru:{t:"Отчёт об отработанных часах",per:"Период",nm:"Сотрудник",dt:"Дата",wd:"День",fr:"С",to:"До",hr:"Часы",off:"выходной",sick:"больничный",sk:"Больничных дней",hu:"ч",dd:"Отработано дней",th:"Всего часов",wdn:["вс","пн","вт","ср","чт","пт","сб"],mo:M},
 pl:{t:"Wykaz przepracowanych godzin",per:"Okres",nm:"Pracownik",dt:"Data",wd:"Dzień",fr:"Od",to:"Do",hr:"Godziny",off:"dzień wolny",sick:"zwolnienie lekarskie",sk:"Dni zwolnienia",hu:"godz.",dd:"Przepracowane dni",th:"Razem godzin",wdn:["nd","pn","wt","śr","cz","pt","sb"],mo:["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień","Wrzesień","Październik","Listopad","Grudzień"]}
};
$("pdf").onclick=async()=>{
  const L=TX[$("rl").value],c=cur(),days=Object.keys(c).map(Number).sort((a,b)=>a-b),msg=$("pdfmsg");
  if(!days.length){msg.textContent="В этом месяце нет записей";return}
  if(!window.jspdf){msg.textContent="Не загрузилась библиотека PDF, проверь интернет";return}
  msg.textContent="Формирую…";
  const S=3,cv=document.createElement("canvas");cv.width=595*S;cv.height=842*S;
  const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);
  const F=(sz,b)=>{x.font=(b?"600 ":"400 ")+sz*S+"px -apple-system,Helvetica,Arial,sans-serif"};
  const T=(s,px,py,al)=>{x.textAlign=al||"left";x.fillText(s,px*S,py*S)};
  const LN=(py,col)=>{x.fillStyle=col;x.fillRect(40*S,py*S,515*S,S)};
  x.fillStyle="#000";F(20,1);T(L.t,40,60);
  F(12);x.fillStyle="#444";T(L.per+": "+L.mo[m]+" "+y,40,86);
  const nm=$("rn").value.trim();if(nm)T(L.nm+": "+nm,40,104);
  const y0=140;
  F(11,1);x.fillStyle="#000";
  T(L.dt,40,y0);T(L.wd,140,y0);T(L.fr,230,y0);T(L.to,300,y0);T(L.hr,555,y0,"right");
  LN(y0+6,"#999");
  F(11);let th=0,wk=0,sk=0,skh=0;
  days.forEach((d,i)=>{
    const e=c[d],py=y0+26+i*20;
    x.fillStyle="#000";
    T(pad(d)+"."+pad(m+1)+"."+y,40,py);
    T(L.wdn[new Date(y,m,d).getDay()],140,py);
    if(e.off){x.fillStyle="#888";T(L.off,230,py);T("—",555,py,"right")}
    else if(e.sick){x.fillStyle="#888";T(L.sick,230,py);T(fmt(e.h),555,py,"right");sk++;skh+=e.h}
    else{T(e.s||"",230,py);T(e.e||"",300,py);T(fmt(e.h),555,py,"right");th+=e.h;wk++}
    LN(py+6,"#e5e5e5");
  });
  const fy=y0+26+days.length*20+16;
  F(12,1);x.fillStyle="#000";T(L.dd+": "+wk,40,fy);T(L.th+": "+fmt(th),40,fy+20);if(sk)T(L.sk+": "+sk+" ("+fmt(skh)+" "+L.hu+")",40,fy+40);
  const img=cv.toDataURL("image/jpeg",0.92);
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  pdf.addImage(img,"JPEG",0,0,595.28,841.89);
  const blob=pdf.output("blob"),fn="hours-"+y+"-"+pad(m+1)+".pdf";
  let done=false;
  try{const dls=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dls){await dls.save({filename:fn,data:blob});msg.textContent="";return}}
  catch(e){if(e&&e.code==="declined"){msg.textContent="";return}}
  const file=new File([blob],fn,{type:"application/pdf"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});msg.textContent="";return}}
  catch(e){if(e&&e.name==="AbortError"){msg.textContent="";return}}
  const u=URL.createObjectURL(blob),an=document.createElement("a");an.href=u;an.download=fn;document.body.append(an);an.click();an.remove();
  msg.textContent="";const l=document.createElement("a");l.href=u;l.target="_blank";l.textContent="Открыть PDF";l.style.color="var(--ac)";msg.append(l);
};
$("d").value=now.getDate();calc();render();
</script>
</body>
</html>
